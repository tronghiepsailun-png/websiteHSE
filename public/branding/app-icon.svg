<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e" />
      <stop offset="1" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Clock ring — "24 giờ" (round-the-clock) -->
  <circle cx="256" cy="204" r="136" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" />
  <!-- Hour ticks at 12/3/6/9 -->
  <line x1="256" y1="60" x2="256" y2="80" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="328" x2="256" y2="348" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" />
  <line x1="112" y1="204" x2="132" y2="204" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" />
  <line x1="380" y1="204" x2="400" y2="204" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" />

  <text
    x="256"
    y="248"
    text-anchor="middle"
    font-family="Arial, 'Segoe UI', Helvetica, sans-serif"
    font-weight="800"
    font-size="158"
    fill="#ffffff"
  >24</text>

  <text
    x="256"
    y="404"
    text-anchor="middle"
    font-family="Arial, 'Segoe UI', Helvetica, sans-serif"
    font-weight="800"
    font-size="66"
    letter-spacing="10"
    fill="#ffffff"
  >HSE</text>
</svg>
